<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会議の時間コスト計算機</title>
  <meta name="description" content="参加人数・時間・1時間あたりの単価から、会議にかかるコストを計算します。">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --accent: #0969da;
      --result-bg: #ddf4ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --accent: #4493f8;
        --result-bg: #121d2f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .field { margin-bottom: 16px; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .unit { color: var(--muted); min-width: 3em; }
    .result {
      margin-top: 8px;
      padding: 16px;
      border-radius: 8px;
      background: var(--result-bg);
      text-align: center;
    }
    .result .label { color: var(--muted); font-size: 0.9rem; }
    .total {
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .detail { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>会議の時間コスト計算機</h1>
    <p class="lead">その会議、いくらかかっていますか？</p>

    <div class="card">
      <div class="field">
        <label for="people">参加人数</label>
        <div class="input-row">
          <input id="people" type="text" inputmode="numeric" autocomplete="off" value="5">
          <span class="unit">人</span>
        </div>
      </div>
      <div class="field">
        <label for="minutes">会議の時間</label>
        <div class="input-row">
          <input id="minutes" type="text" inputmode="numeric" autocomplete="off" value="60">
          <span class="unit">分</span>
        </div>
      </div>
      <div class="field">
        <label for="rate">1時間あたりの単価（1人あたり）</label>
        <div class="input-row">
          <input id="rate" type="text" inputmode="decimal" autocomplete="off" value="50">
          <span class="unit">ドル/時</span>
        </div>
      </div>

      <div class="result" aria-live="polite">
        <div class="label">合計コスト</div>
        <div class="total" id="total">$0</div>
        <div class="detail" id="detail"></div>
      </div>
    </div>

    <footer>入力した数字はこのブラウザの中だけで計算され、どこにも送られません。</footer>
  </main>

  <script>
    const people = document.getElementById("people");
    const minutes = document.getElementById("minutes");
    const rate = document.getElementById("rate");
    const total = document.getElementById("total");
    const detail = document.getElementById("detail");
    // 合計など、セントまで出すときは cents を 2 にする
    const usd = (n, cents = 0) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: cents, maximumFractionDigits: cents });
    const allowsDecimal = (el) => el === rate; // 単価だけはセント（小数第2位まで）を入力できる

    // 全角の数字・ピリオドも半角にそろえ、数字（と単価なら小数点1つ・小数第2位まで）以外を取り除く
    function clean(s, decimal) {
      s = s.replace(/[０-９．]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
      if (!decimal) return s.replace(/\D/g, "");
      s = s.replace(/[^\d.]/g, "");
      const dot = s.indexOf(".");
      return dot < 0 ? s : s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, "").slice(0, 2);
    }
    const num = (el) => Number(clean(el.value, allowsDecimal(el))) || 0;

    // 入力欄を3桁カンマ付きに整え、カーソルは同じ数字の後ろに戻す
    function formatInput(el) {
      const decimal = allowsDecimal(el);
      let before = clean(el.value.slice(0, el.selectionStart), decimal).length;
      const c = clean(el.value, decimal);
      const [int, frac] = c.split(".");
      if (int === "" && frac !== undefined) before++; // 「.5」は「0.5」にするので、足した 0 の分ずらす
      el.value = c === "" ? "" : Number(int || 0).toLocaleString("en-US") + (frac !== undefined ? "." + frac : "");
      let pos = 0;
      for (let seen = 0; pos < el.value.length && seen < before; pos++) {
        if (/[\d.]/.test(el.value[pos])) seen++;
      }
      el.setSelectionRange(pos, pos);
    }

    function update() {
      const p = num(people), m = num(minutes), r = num(rate);
      const sum = p * (m / 60) * r;
      total.textContent = usd(Math.round(sum));
      detail.textContent = m > 0
        ? `1分あたり ${usd(sum / m, 2)}（${p.toLocaleString("en-US")}人 × ${m.toLocaleString("en-US")}分 × ${usd(r, Number.isInteger(r) ? 0 : 2)}/時）`
        : "";
    }

    [people, minutes, rate].forEach((el) => el.addEventListener("input", (e) => {
      // 日本語入力の変換中は整形しない（確定後の input で整形される）
      if (!e.isComposing) formatInput(el);
      update();
    }));
    update();
  </script>
</body>
</html>
